# Saransh local development — API + web + Postgres

services:
  postgres:
    image: postgres:16-alpine
    container_name: saransh-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rajniti}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rajniti}
      POSTGRES_DB: ${POSTGRES_DB:-rajniti}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  saransh-api:
    build:
      context: .
      target: development
    container_name: saransh-api
    env_file:
      - .env
    ports:
      - "${SARANSH_API_PORT:-8001}:8001"
    volumes:
      - ./app:/app/app
      - ./main.py:/app/main.py
      - ./scripts:/app/scripts
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  saransh-web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: saransh-web
    depends_on:
      saransh-api:
        condition: service_started
    ports:
      - "${FRONTEND_PORT:-3001}:3001"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/next.config.mjs:/app/next.config.mjs
      - ./frontend/postcss.config.mjs:/app/postcss.config.mjs
      - ./frontend/tsconfig.json:/app/tsconfig.json
      - ./frontend/vitest.config.ts:/app/vitest.config.ts
      - ./frontend/.eslintrc.json:/app/.eslintrc.json
      - ./frontend/package.json:/app/package.json
      - ./frontend/package-lock.json:/app/package-lock.json
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8001/api/v1
      NEXT_PUBLIC_API_ORIGIN: http://localhost:8001
      API_REWRITE_TARGET: http://saransh-api:8001
      WATCHPACK_POLLING: "true"
    env_file:
      - path: frontend/.env
        required: false
    restart: unless-stopped

volumes:
  postgres_data:
