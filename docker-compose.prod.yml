# Production: API only — set DATABASE_URL in .env

services:
  saransh-api:
    build:
      context: .
      target: production
    container_name: saransh-api-prod
    env_file:
      - .env
    ports:
      - "${SARANSH_API_PORT:-8001}:${PORT:-8080}"
    healthcheck:
      # $$ escapes Compose interpolation so the container shell expands PORT at runtime.
      test: ["CMD-SHELL", "curl -f http://localhost:$${PORT:-8080}/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
