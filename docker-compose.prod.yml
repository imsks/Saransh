# Production: API only — set DATABASE_URL in .env

services:
  saransh-api:
    build:
      context: .
      target: production
    container_name: saransh-api-prod
    env_file:
      - .env
    ports:
      - "${SARANSH_API_PORT:-8001}:8001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
